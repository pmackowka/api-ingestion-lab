name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest

  dbt-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          project_id: api-ingestion-lab-bq
          workload_identity_provider: projects/20809902270/locations/global/workloadIdentityPools/github/providers/api-ingestion-lab
          service_account: ingest-runner@api-ingestion-lab-bq.iam.gserviceaccount.com

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --group dbt

      - name: dbt deps
        run: uv run --frozen --group dbt dbt deps

      - name: dbt unit tests
        run: uv run --frozen --group dbt dbt test --select "test_type:unit"
