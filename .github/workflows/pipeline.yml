name: Pipeline

on:
  schedule:
    - cron: '41 1 * * *'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  PROJECT: api-ingestion-lab-bq
  LOOKBACK_DAYS: 7

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: nbp
            args: ''
          - source: weather
            args: ''
          - source: ga4
            args: '--property 539646739'
          - source: search_console
            args: '--site sc-domain:pmdata.pl'
          - source: hubspot
            args: ''
          - source: holidays
            args: ''
          - source: sitemap
            args: ''
    name: ingest (${{ matrix.source }})
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: projects/20809902270/locations/global/workloadIdentityPools/github/providers/api-ingestion-lab
          service_account: ingest-runner@api-ingestion-lab-bq.iam.gserviceaccount.com

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Ingest ${{ matrix.source }}
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: uv run python -m ${{ matrix.source }}.ingest --project $PROJECT --lookback-days $LOOKBACK_DAYS ${{ matrix.args }}

  generate-leads:
    needs: ingest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: projects/20809902270/locations/global/workloadIdentityPools/github/providers/api-ingestion-lab
          service_account: ingest-runner@api-ingestion-lab-bq.iam.gserviceaccount.com
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Generate HubSpot leads and deals
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: uv run python -m hubspot.generate --project $PROJECT --lookback-days $LOOKBACK_DAYS

  dbt:
    needs: ingest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: projects/20809902270/locations/global/workloadIdentityPools/github/providers/api-ingestion-lab
          service_account: ingest-runner@api-ingestion-lab-bq.iam.gserviceaccount.com
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --group dbt
      - run: uv run --frozen --group dbt dbt deps
      - name: Build models and run tests
        run: uv run --frozen --group dbt dbt build --target prod
      - name: Check source freshness
        if: ${{ !cancelled() }}
        run: uv run --frozen --group dbt dbt source freshness --target prod
