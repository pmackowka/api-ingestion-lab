unit_tests:
  # unit: wpłaty sumowane na fakturę, liczą się tylko zaksięgowane faktury i nieanulowane wpłaty
  - name: test_deal_revenue_sums_valid_payments
    model: int_deal_revenue
    given:
      - input: ref('stg_hubspot__deals')
        rows:
          - {deal_id: "1", deal_key: deal-a, dealstage: closedwon}
          - {deal_id: "2", deal_key: deal-b, dealstage: closedwon}
          - {deal_id: "3", deal_key: deal-c, dealstage: closedlost}
      - input: ref('stg_odoo__invoices')
        rows:
          - {invoice_id: 10, deal_key: deal-a, state: posted, amount_untaxed: 1000, amount_total: 1230}
          - {invoice_id: 20, deal_key: deal-b, state: cancel, amount_untaxed: 2000, amount_total: 2460}
      - input: ref('stg_odoo__payments')
        rows:
          - {invoice_id: 10, state: reconciled, amount: 1000}
          - {invoice_id: 10, state: paid, amount: 230}
          - {invoice_id: 10, state: canceled, amount: 500}
          - {invoice_id: 20, state: reconciled, amount: 2460}
    expect:
      rows:
        - {deal_id: "1", is_won: true, invoice_id: 10, invoiced_amount_net: 1000, invoiced_amount_gross: 1230, paid_amount: 1230}
        - {deal_id: "2", is_won: true, invoice_id: null, invoiced_amount_net: null, invoiced_amount_gross: null, paid_amount: 0}
        - {deal_id: "3", is_won: false, invoice_id: null, invoiced_amount_net: null, invoiced_amount_gross: null, paid_amount: 0}
