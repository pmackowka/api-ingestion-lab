models:
  - name: int_deal_revenue
    description: Deal z fakturą z Odoo i sumą wpłat; jeden wiersz = deal.
    data_tests:
      # generic z paczki: złączenia z fakturą i wpłatami nie gubią deali
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_hubspot__deals')
    columns:
      - name: deal_id
        data_tests:
          # generic wbudowany: złączenia nie mnożą deala
          - unique
          # generic wbudowany
          - not_null
      - name: is_won
        data_tests:
          # generic wbudowany: null w dealstage dałby null zamiast false i zaniżył won_deals w fct_leads
          - not_null

  - name: int_invoices_converted_to_pln
    description: Faktury z Odoo z kwotami w PLN po kursie średnim NBP z ostatniego dnia notowań przed datą faktury (art. 31a ustawy o VAT); jeden wiersz = faktura.
    data_tests:
      # generic z paczki: złączenie z kursami nie gubi ani nie mnoży faktur
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_odoo__invoices')
    columns:
      - name: invoice_id
        data_tests:
          # generic wbudowany
          - unique
          # generic wbudowany
          - not_null
      - name: exchange_rate
        data_tests:
          # generic wbudowany: brak kursu dla waluty obcej dałby null w kwotach PLN
          - not_null
      - name: exchange_rate_date
        data_tests:
          # generic wbudowany: waluta obca ma datę kursu z tabeli A NBP
          - not_null:
              config:
                where: "currency != 'PLN'"
