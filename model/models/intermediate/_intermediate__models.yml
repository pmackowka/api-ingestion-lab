models:
  - name: int_deal_revenue
    description: Deal z fakturą z Odoo i sumą wpłat; kwoty w PLN, wpłaty po kursie faktury; jeden wiersz = deal.
    data_tests:
      # generic z paczki: złączenia z fakturą i wpłatami nie gubią deali
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_hubspot__deals')
    columns:
      - name: deal_id
        data_tests:
          # generic wbudowany: złączenia nie mnożą deala
          - unique
          # generic wbudowany
          - not_null
      - name: is_won
        data_tests:
          # generic wbudowany: null w dealstage dałby null zamiast false i zaniżył won_deals w fct_leads
          - not_null

  - name: int_invoices_converted_to_pln
    description: Faktury z Odoo z kwotami w PLN po kursie średnim NBP z ostatniego dnia notowań przed datą faktury (art. 31a ustawy o VAT); jeden wiersz = faktura.
    data_tests:
      # generic z paczki: złączenie z kursami nie gubi ani nie mnoży faktur
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_odoo__invoices')
    columns:
      - name: invoice_id
        data_tests:
          # generic wbudowany
          - unique
          # generic wbudowany
          - not_null
      - name: exchange_rate
        data_tests:
          # generic wbudowany: brak kursu dla waluty obcej dałby null w kwotach PLN
          - not_null
      - name: exchange_rate_date
        data_tests:
          # generic wbudowany: waluta obca ma datę kursu z tabeli A NBP
          - not_null:
              config:
                where: "currency != 'PLN'"

  - name: int_search_pages_with_articles
    description: Wyniki dzienne podstron z Search Console ze stroną z sitemapy po adresie kanonicznym (https, bez www, /blog/ → /artykuly/, końcowy /); jeden wiersz = dzień × strona.
    data_tests:
      # generic z paczki: złączenie z sitemapą nie gubi ani nie mnoży wierszy Search Console
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_search_console__search_pages_daily')
      # generic z paczki: ziarno modelu (dzień × strona) bez duplikatów
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - report_date
              - page
      # generic z paczki: Google nie pokazuje artykułu przed publikacją; ujemna liczba dni oznacza złą datę w JSON-LD
      - dbt_utils.expression_is_true:
          arguments:
            expression: "days_since_published >= 0"
          config:
            where: "is_article"
    columns:
      - name: canonical_page
        data_tests:
          # generic wbudowany
          - not_null
