models:
  - name: dim_date
    description: Wymiar daty; jeden wiersz = dzień od 2025-01-01 do dziś (Europe/Warsaw).
    # warstwa semantyczna
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        # warstwa semantyczna
        granularity: day
        data_tests:
          # generic wbudowany
          - unique
          # generic wbudowany
          - not_null
          # generic z paczki: kolejne dni bez przerw
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: day
      - name: iso_day_of_week
        description: Dzień tygodnia według ISO 8601; 1 = poniedziałek, 7 = niedziela.
        data_tests:
          # generic wbudowany
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: is_holiday
        description: Święto państwowe w Polsce (Nager.Date); false także dla dni przed pierwszym załadowanym rokiem.
        data_tests:
          # generic wbudowany: left join ze świętami daje false, nie null — null oznaczałby błąd w warunku
          - not_null
      - name: is_rainy_day
        description: Deszcz (co najmniej 1 mm) w co najmniej 3 z 5 miast.
      - name: temperature_band
        description: Przedział średniej temperatury z 5 miast; null dla dni bez pogody.
        data_tests:
          # generic wbudowany: przedziały z case w dim_date.sql
          - accepted_values:
              arguments:
                values: ["freezing", "cold", "warm", "hot"]
          # generic wbudowany: pogoda bez dziur w historii; ostatnie 7 dni pomija, bo ingest je przelicza, a opóźnienie łapie dbt source freshness
          - not_null:
              config:
                where: "date_day < date_sub(current_date('Europe/Warsaw'), interval 7 day)"

  - name: dim_source
    description: Wymiar źródła ruchu z kanałem; jeden wiersz = oryginalna para source / medium z GA4 i HubSpot.
    data_tests:
      # generic z paczki: nowe źródło bez kanału (poza znanym (not set)) czeka na regułę albo alias
      - dbt_utils.expression_is_true:
          arguments:
            expression: "channel != 'Unassigned' or source_medium = '(not set) / (not set)'"
          config:
            severity: warn
    columns:
      - name: source_medium
        data_tests:
          # generic wbudowany
          - unique
          # generic wbudowany
          - not_null
      - name: channel
        data_tests:
          # generic wbudowany: tylko kanały z instrukcji case w dim_source.sql
          - accepted_values:
              arguments:
                values: ["Direct", "Paid Search", "Organic Search", "AI Assistant", "Owned", "Organic Social", "Referral", "Unassigned"]

  - name: fct_traffic_daily
    description: Ruch i kliknięcia w kontakt; jeden wiersz = dzień × source / medium.
    data_tests:
      # generic z paczki: ziarno modelu (dzień × source / medium) bez duplikatów
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_day
              - source_medium
      # generic z paczki: sesje zaangażowane to podzbiór wszystkich sesji
      - dbt_utils.expression_is_true:
          arguments:
            expression: "engaged_sessions <= sessions"
    columns:
      - name: date_day
        data_tests:
          # generic wbudowany: każdy dzień faktu istnieje w wymiarze daty
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: source_medium
        data_tests:
          # generic wbudowany: każde źródło faktu istnieje w wymiarze źródła
          - relationships:
              arguments:
                to: ref('dim_source')
                field: source_medium

  - name: fct_leads
    description: Leady z HubSpota z sumą deali, faktur i wpłat; jeden wiersz = kontakt, leady testowe oznaczone flagą.
    # warstwa semantyczna
    semantic_model:
      enabled: true
    agg_time_dimension: lead_date
    data_tests:
      # generic z paczki: złączenie z dealami nie gubi kontaktów
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_hubspot__contacts')
      # generic z paczki: lead testowy odpada na kwalifikacji w CRM, więc nie ma deali; warn, bo to błąd w CRM, nie w pipeline
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_test_lead or deals = 0"
          config:
            severity: warn
    columns:
      - name: contact_id
        # warstwa semantyczna
        entity:
          type: primary
          name: lead
        data_tests:
          # generic wbudowany: deale zsumowane po kontakcie, więc lead się nie dubluje
          - unique
          # generic wbudowany
          - not_null
      - name: lead_date
        # warstwa semantyczna
        granularity: day
        dimension:
          type: time
        data_tests:
          # generic wbudowany: każdy dzień leada istnieje w wymiarze daty
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: source_medium
        # warstwa semantyczna
        dimension:
          type: categorical
        data_tests:
          # generic wbudowany: źródło prawdziwego leada istnieje w wymiarze źródła; dim_source pomija źródła testowe
          - relationships:
              arguments:
                to: ref('dim_source')
                field: source_medium
              config:
                where: "not is_test_lead"
      # warstwa semantyczna
      - name: is_test_lead
        dimension:
          type: categorical
    # warstwa semantyczna
    metrics:
      - name: leads
        description: Liczba leadów (kontaktów); leady testowe odfiltruj wymiarem is_test_lead.
        type: simple
        label: Leady
        agg: count
        expr: contact_id
      - name: won_deals
        description: Liczba wygranych deali.
        type: simple
        label: Wygrane deale
        agg: sum
      - name: won_amount
        description: Kwota netto wygranych deali w PLN.
        type: simple
        label: Wartość wygranych deali
        agg: sum
      - name: invoiced_amount_net
        description: Zafakturowana kwota netto w PLN.
        type: simple
        label: Faktury netto
        agg: sum
      - name: paid_amount
        description: Suma wpłat w PLN po kursie faktury.
        type: simple
        label: Wpłaty
        agg: sum
