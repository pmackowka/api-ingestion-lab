models:
  - name: stg_ga4__traffic_daily
    description: Ruch dzienny bez wejść z Tag Assistanta; jeden wiersz = dzień × source × medium.
    data_tests:
      # generic z paczki: ziarno modelu (dzień × source × medium) bez duplikatów
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - report_date
              - source
              - medium
      # generic z paczki: sesje zaangażowane to podzbiór wszystkich sesji
      - dbt_utils.expression_is_true:
          arguments:
            expression: "engaged_sessions <= sessions"
    columns:
      - name: report_date
        data_tests:
          # generic wbudowany
          - not_null
      - name: source
        data_tests:
          # generic wbudowany
          - not_null
      - name: medium
        data_tests:
          # generic wbudowany
          - not_null
