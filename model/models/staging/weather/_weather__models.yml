models:
  - name: stg_weather__daily_weather
    description: Pogoda dzienna dla pięciu miast; jeden wiersz = dzień × miasto.
    data_tests:
      # generic z paczki: ziarno modelu (dzień × miasto) bez duplikatów
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - weather_date
              - location_id
      # generic z paczki: suma opadów nie może być ujemna
      - dbt_utils.expression_is_true:
          arguments:
            expression: "precipitation_sum >= 0"
    columns:
      - name: weather_date
        data_tests:
          # generic wbudowany
          - not_null
      - name: location_id
        data_tests:
          # generic wbudowany
          - not_null
          # generic wbudowany: tylko miasta z LOCATIONS w weather/ingest.py
          - accepted_values:
              arguments:
                values: ["warszawa", "krakow", "wroclaw", "poznan", "gdansk"]
      - name: weather_code
        data_tests:
          # generic wbudowany: kody WMO z dokumentacji Open-Meteo
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 45, 48, 51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 71, 73, 75, 77, 80, 81, 82, 85, 86, 95, 96, 97, 99]
                quote: false
