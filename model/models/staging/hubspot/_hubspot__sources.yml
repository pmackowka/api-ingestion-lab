sources:
  - name: hubspot
    description: Kontakty i deale z konta testowego HubSpot (dane syntetyczne), ładowane przez hubspot/ingest.py.
    schema: raw_hubspot
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 30, period: hour}
        error_after: {count: 54, period: hour}
    tables:
      - name: contacts
        description: Kontakty; jeden wiersz = kontakt (lead).
      - name: deals
        description: Deale; jeden wiersz = deal powiązany z jednym kontaktem.
